<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>L1 - Enhanced Todo List</title>
    <style>
      .completed {
        text-decoration: line-through;
        color: gray;
      }
    </style>
  </head>
  <body>
    <h1>Todo List</h1>

    <!-- Input to add new tasks -->
    <input id="task-input" type="text" placeholder="Enter a task" />
    <button id="add-btn">Add Task</button>
    <br /><br />

    <!-- Search bar for real-time filtering -->
    <input id="search-input" type="text" placeholder="Search tasks..." />
    <br /><br />

    <!-- List where tasks will be displayed -->
    <ul id="task-list"></ul>

    <script src="script.js"></script>
  </body>
</html>
